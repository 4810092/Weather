name: Nimbo
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: Nimbo
    PRODUCT_BUNDLE_IDENTIFIER: uz.ganikhodjaev.weather
    MARKETING_VERSION: 1.1.0
    CURRENT_PROJECT_VERSION: 8
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5SWEZ7HTYP
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Archive/release invocations must override this with one full Git commit.
    # The verifier deliberately rejects this sentinel in signed candidates.
    NIMBO_SOURCE_REVISION: UNVERIFIED_SOURCE
targets:
  Nimbo:
    type: application
    platform: iOS
    sources:
      - path: Nimbo
        excludes:
          - Info.plist
      - path: NimboSurfaces/SurfaceWeatherState.swift
    info:
      path: Nimbo/Info.plist
      properties:
        CFBundleDisplayName: Nimbo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NimboSourceRevision: $(NIMBO_SOURCE_REVISION)
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        BGTaskSchedulerPermittedIdentifiers:
          - uz.ganikhodjaev.weather.refresh
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIBackgroundModes:
          - fetch
        NSLocationWhenInUseUsageDescription: Nimbo uses your approximate location to show weather around you.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Nimbo/Nimbo.entitlements
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - NimboShared
          - "-lsqlite3"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "iOS Team Store Provisioning Profile: uz.ganikhodjaev.weather"
    dependencies:
      - target: NimboWidget
        embed: true
      - target: NimboWatch
        embed: true
        platformFilter: watchOS
    preBuildScripts:
      - name: Compile shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd "$SRCROOT/.."
          ./gradlew --no-daemon :shared:embedAndSignAppleFrameworkForXcode
  NimboWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: NimboWidget
      - path: NimboSurfaces
    info:
      path: NimboWidget/Info.plist
      properties:
        CFBundleDisplayName: Nimbo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NimboSourceRevision: $(NIMBO_SOURCE_REVISION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: NimboWidget
        PRODUCT_MODULE_NAME: NimboWidget
        PRODUCT_BUNDLE_IDENTIFIER: uz.ganikhodjaev.weather.widget
        CODE_SIGN_ENTITLEMENTS: NimboWidget/NimboWidget.entitlements
        SKIP_INSTALL: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "iOS Team Store Provisioning Profile: uz.ganikhodjaev.weather.widget"
  NimboSimulator:
    type: application
    platform: iOS
    sources:
      - path: Nimbo
        excludes:
          - Info.plist
      - path: NimboSurfaces/SurfaceWeatherState.swift
    info:
      path: NimboSimulator/Info.plist
      properties:
        CFBundleDisplayName: Nimbo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NimboSourceRevision: $(NIMBO_SOURCE_REVISION)
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        BGTaskSchedulerPermittedIdentifiers:
          - uz.ganikhodjaev.weather.refresh
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UIBackgroundModes:
          - fetch
        NSLocationWhenInUseUsageDescription: Nimbo uses your approximate location to show weather around you.
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_NAME: NimboSimulator
        PRODUCT_MODULE_NAME: NimboSimulator
        PRODUCT_BUNDLE_IDENTIFIER: uz.ganikhodjaev.weather
        CODE_SIGN_ENTITLEMENTS: Nimbo/Nimbo.entitlements
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - NimboShared
          - "-lsqlite3"
    dependencies:
      - target: NimboWidget
        embed: true
    preBuildScripts:
      - name: Compile shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          export JAVA_HOME="$(/usr/libexec/java_home -v 17)"
          export PATH="$JAVA_HOME/bin:$PATH"
          cd "$SRCROOT/.."
          ./gradlew --no-daemon :shared:embedAndSignAppleFrameworkForXcode
  NimboWatch:
    # Modern SwiftUI watchOS apps contain their executable directly. The old
    # WatchKit 2 app + extension product types are no longer resolvable when
    # Xcode 26 builds the companion iOS app for a simulator.
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: NimboWatch
        excludes:
          - Info.plist
      - path: NimboSurfaces
      - path: Nimbo/Assets.xcassets
    info:
      path: NimboWatch/Info.plist
      properties:
        CFBundleDisplayName: Nimbo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NimboSourceRevision: $(NIMBO_SOURCE_REVISION)
        WKCompanionAppBundleIdentifier: uz.ganikhodjaev.weather
        WKApplication: true
    settings:
      base:
        PRODUCT_NAME: NimboWatch
        PRODUCT_MODULE_NAME: NimboWatch
        PRODUCT_BUNDLE_IDENTIFIER: uz.ganikhodjaev.weather.watchkitapp
        WATCHOS_DEPLOYMENT_TARGET: 10.0
        SKIP_INSTALL: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "iOS Team Store Provisioning Profile: uz.ganikhodjaev.weather.watchkitapp"
  NimboSurfaceTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: NimboSurfaceTests
      - path: NimboSurfaces/SurfaceWeatherState.swift
    settings:
      base:
        PRODUCT_NAME: NimboSurfaceTests
        PRODUCT_MODULE_NAME: NimboSurfaceTests
        PRODUCT_BUNDLE_IDENTIFIER: uz.ganikhodjaev.weather.surface-tests
        GENERATE_INFOPLIST_FILE: true
schemes:
  Nimbo:
    build:
      targets:
        Nimbo: all
    run:
      config: Debug
    archive:
      config: Release
  NimboSimulator:
    build:
      targets:
        NimboSimulator: all
    run:
      config: Debug
  NimboWatch:
    build:
      targets:
        NimboWatch: all
    run:
      config: Debug
    archive:
      config: Release
  NimboWidget:
    build:
      targets:
        NimboWidget: all
    run:
      config: Debug
  NimboSurfaceTests:
    build:
      targets:
        NimboSurfaceTests: [test]
    test:
      config: Debug
      targets:
        - NimboSurfaceTests
