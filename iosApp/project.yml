name: Nimbo
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: Nimbo
    PRODUCT_BUNDLE_IDENTIFIER: uz.ganikhodjaev.weather
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 5SWEZ7HTYP
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Nimbo:
    type: application
    platform: iOS
    sources:
      - path: Nimbo
    info:
      path: Nimbo/Info.plist
      properties:
        CFBundleDisplayName: Nimbo
        CADisableMinimumFrameDurationOnPhone: true
        NSLocationWhenInUseUsageDescription: Nimbo uses your approximate location to show weather around you.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-framework"
          - NimboShared
          - "-lsqlite3"
    preBuildScripts:
      - name: Compile shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
schemes:
  Nimbo:
    build:
      targets:
        Nimbo: all
    run:
      config: Debug
    archive:
      config: Release
