name: Signed release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signed-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-unsigned:
    if: github.repository == '4810092/Weather' && github.ref == 'refs/heads/master'
    runs-on: macos-26
    timeout-minutes: 55
    outputs:
      source_revision: ${{ steps.release.outputs.source_revision }}
      phone_filename: ${{ steps.release.outputs.phone_filename }}
      wear_filename: ${{ steps.release.outputs.wear_filename }}
      apple_filename: ${{ steps.release.outputs.apple_filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Resolve exact release source and unsigned staging paths
        id: release
        shell: bash
        run: |
          set -euo pipefail
          source_revision="$(python3 -I - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path("store/upload-manifest-1.1.0.json").read_text())
          revision = manifest.get("source_revision")
          if not isinstance(revision, str) or re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit("manifest source revision is not a full lowercase Git SHA")
          print(revision)
          PY
          )"
          source_root="$RUNNER_TEMP/nimbo-release-source"
          unsigned_root="$RUNNER_TEMP/nimbo-unsigned-inputs"
          git clone --quiet --no-local --no-checkout --no-tags \
            "$GITHUB_WORKSPACE" \
            "$source_root"
          git -C "$source_root" checkout --quiet --detach "$source_revision"
          git -C "$source_root" remote remove origin
          [[ -d "$source_root/.git" ]]
          [[ ! -e "$source_root/.git/objects/info/alternates" ]]
          [[ "$(git -C "$source_root" rev-parse --verify 'HEAD^{commit}')" == "$source_revision" ]]
          [[ -z "$(git -C "$source_root" status --porcelain=v1 --untracked-files=all)" ]]
          install -d -m 700 "$unsigned_root"
          {
            echo "NIMBO_SOURCE_REVISION=$source_revision"
            echo "NIMBO_SOURCE_ROOT=$source_root"
            echo "NIMBO_UNSIGNED_ROOT=$unsigned_root"
          } >> "$GITHUB_ENV"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          manifest = json.loads(Path("store/upload-manifest-1.1.0.json").read_text())
          artifacts = manifest["artifacts"]
          print(f"source_revision={manifest['source_revision']}")
          print(f"phone_filename={artifacts['android_phone']['filename']}")
          print(f"wear_filename={artifacts['wear_os']['filename']}")
          print(f"apple_filename={artifacts['apple']['filename']}")
          PY

      - name: Validate and seal exact release inputs
        shell: bash
        run: |
          set -euo pipefail
          cd "$NIMBO_SOURCE_ROOT"
          release_source_paths=(
            androidSurfaceContract
            app
            shared
            wearApp
            iosApp
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle
            gradlew
            gradlew.bat
          )
          release_generated_paths=(
            ':(exclude)androidSurfaceContract/build/**'
            ':(exclude)app/build/**'
            ':(exclude)shared/build/**'
            ':(exclude)wearApp/build/**'
            ':(exclude)iosApp/build/**'
            ':(exclude)**/.cxx/**'
            ':(exclude)**/.externalNativeBuild/**'
            ':(exclude)**/.DS_Store'
            ':(exclude)iosApp/**/xcuserdata/**'
            ':(exclude)iosApp/**/DerivedData/**'
          )
          for forbidden_gradle_override in \
            '--write-verification-metadata' \
            '--dependency-verification' \
            'org.gradle.dependency.verification'; do
            if git grep --quiet --fixed-strings \
              -e "$forbidden_gradle_override" \
              -- "${release_source_paths[@]}"; then
              echo "release inputs must not override Gradle dependency verification" >&2
              exit 1
            else
              grep_status=$?
              [[ "$grep_status" == "1" ]]
            fi
          done
          git diff --quiet --no-ext-diff "$NIMBO_SOURCE_REVISION" -- \
            "${release_source_paths[@]}" \
            "${release_generated_paths[@]}"
          untracked="$RUNNER_TEMP/nimbo-release-inputs-untracked-before"
          git ls-files --others -z -- \
            "${release_source_paths[@]}" \
            "${release_generated_paths[@]}" \
            > "$untracked"
          [[ ! -s "$untracked" ]]
          rm -f -- "$untracked"

      - name: Build exact-source Android phone and Wear bundles
        shell: bash
        run: |
          set -euo pipefail
          cd "$NIMBO_SOURCE_ROOT"
          ./gradlew \
            ktlintCheck \
            :shared:allTests \
            :shared:testAndroidHostTest \
            :app:testDebugUnitTest \
            :wearApp:testDebugUnitTest \
            :shared:verifySqlDelightMigration \
            :app:lintRelease \
            :wearApp:lintRelease \
            :app:bundleRelease \
            :wearApp:bundleRelease
          python3 -I - "$NIMBO_SOURCE_REVISION" \
            app/build/outputs/bundle/release/app-release.aab \
            wearApp/build/outputs/bundle/release/wearApp-release.aab <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          revision = sys.argv[1]
          expected = (
              "repositories {\n"
              "  system: GIT\n"
              '  local_root_path: "$PROJECT_DIR"\n'
              f'  revision: "{revision}"\n'
              "}\n"
          ).encode()
          metadata_path = "base/root/META-INF/version-control-info.textproto"
          for argument in sys.argv[2:]:
              bundle = Path(argument)
              with zipfile.ZipFile(bundle) as archive:
                  matches = [
                      entry for entry in archive.infolist()
                      if entry.filename == metadata_path
                  ]
                  if len(matches) != 1:
                      raise SystemExit(
                          f"{bundle}: expected exactly one {metadata_path} entry"
                      )
                  payload = archive.read(matches[0])
              if payload != expected:
                  raise SystemExit(
                      f"{bundle}: embedded Git revision is missing or not exact"
                  )
          PY

      - name: Build exact-source unsigned Apple archive
        shell: bash
        run: |
          set -euo pipefail
          cd "$NIMBO_SOURCE_ROOT"
          xcodebuild \
            -project iosApp/Nimbo.xcodeproj \
            -scheme Nimbo \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$NIMBO_UNSIGNED_ROOT/Nimbo.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            NIMBO_SOURCE_REVISION="$NIMBO_SOURCE_REVISION" \
            archive

      - name: Verify exact release inputs remained sealed
        shell: bash
        run: |
          set -euo pipefail
          cd "$NIMBO_SOURCE_ROOT"
          release_source_paths=(
            androidSurfaceContract
            app
            shared
            wearApp
            iosApp
            build.gradle.kts
            settings.gradle.kts
            gradle.properties
            gradle
            gradlew
            gradlew.bat
          )
          release_generated_paths=(
            ':(exclude)androidSurfaceContract/build/**'
            ':(exclude)app/build/**'
            ':(exclude)shared/build/**'
            ':(exclude)wearApp/build/**'
            ':(exclude)iosApp/build/**'
            ':(exclude)**/.cxx/**'
            ':(exclude)**/.externalNativeBuild/**'
            ':(exclude)**/.DS_Store'
            ':(exclude)iosApp/**/xcuserdata/**'
            ':(exclude)iosApp/**/DerivedData/**'
          )
          for forbidden_gradle_override in \
            '--write-verification-metadata' \
            '--dependency-verification' \
            'org.gradle.dependency.verification'; do
            if git grep --quiet --fixed-strings \
              -e "$forbidden_gradle_override" \
              -- "${release_source_paths[@]}"; then
              echo "release inputs must not override Gradle dependency verification" >&2
              exit 1
            else
              grep_status=$?
              [[ "$grep_status" == "1" ]]
            fi
          done
          git diff --quiet --no-ext-diff "$NIMBO_SOURCE_REVISION" -- \
            "${release_source_paths[@]}" \
            "${release_generated_paths[@]}"
          untracked="$RUNNER_TEMP/nimbo-release-inputs-untracked-after"
          git ls-files --others -z -- \
            "${release_source_paths[@]}" \
            "${release_generated_paths[@]}" \
            > "$untracked"
          [[ ! -s "$untracked" ]]
          rm -f -- "$untracked"

      - name: Package inert unsigned build outputs
        shell: bash
        run: |
          set -euo pipefail
          cp "$NIMBO_SOURCE_ROOT/app/build/outputs/bundle/release/app-release.aab" \
            "$NIMBO_UNSIGNED_ROOT/phone-unsigned.aab"
          cp "$NIMBO_SOURCE_ROOT/wearApp/build/outputs/bundle/release/wearApp-release.aab" \
            "$NIMBO_UNSIGNED_ROOT/wear-unsigned.aab"
          cp "$NIMBO_SOURCE_ROOT/app/build/outputs/mapping/release/mapping.txt" \
            "$NIMBO_UNSIGNED_ROOT/phone-mapping.txt"
          cp "$NIMBO_SOURCE_ROOT/iosApp/ExportOptions.plist" \
            "$NIMBO_UNSIGNED_ROOT/ExportOptions.plist"
          cd "$NIMBO_UNSIGNED_ROOT"
          tar -czf "$RUNNER_TEMP/nimbo-unsigned-inputs.tar.gz" \
            phone-unsigned.aab \
            wear-unsigned.aab \
            phone-mapping.txt \
            ExportOptions.plist \
            Nimbo.xcarchive
          cd "$RUNNER_TEMP"
          shasum -a 256 nimbo-unsigned-inputs.tar.gz \
            > nimbo-unsigned-inputs.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nimbo-unsigned-inputs-${{ steps.release.outputs.source_revision }}
          path: |
            ${{ runner.temp }}/nimbo-unsigned-inputs.tar.gz
            ${{ runner.temp }}/nimbo-unsigned-inputs.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Remove unsigned build clone
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${NIMBO_SOURCE_ROOT:-}" && "$NIMBO_SOURCE_ROOT" == "$RUNNER_TEMP/nimbo-release-source" ]]; then
            rm -rf -- "$NIMBO_SOURCE_ROOT"
          fi

  sign-verify:
    if: github.repository == '4810092/Weather' && github.ref == 'refs/heads/master' && needs.build-unsigned.result == 'success'
    needs: build-unsigned
    environment: release-signing
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: nimbo-unsigned-inputs-${{ needs.build-unsigned.outputs.source_revision }}
          path: ${{ runner.temp }}/nimbo-unsigned-download

      - name: Validate and unpack inert unsigned inputs
        shell: bash
        env:
          NIMBO_HANDOFF_SOURCE_REVISION: ${{ needs.build-unsigned.outputs.source_revision }}
          NIMBO_HANDOFF_PHONE_FILENAME: ${{ needs.build-unsigned.outputs.phone_filename }}
          NIMBO_HANDOFF_WEAR_FILENAME: ${{ needs.build-unsigned.outputs.wear_filename }}
          NIMBO_HANDOFF_APPLE_FILENAME: ${{ needs.build-unsigned.outputs.apple_filename }}
        run: |
          set -euo pipefail
          source_revision="$NIMBO_HANDOFF_SOURCE_REVISION"
          python3 -I - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path("store/upload-manifest-1.1.0.json").read_text())
          revision = manifest.get("source_revision")
          artifacts = manifest.get("artifacts")
          if not isinstance(revision, str) or re.fullmatch(r"[0-9a-f]{40}", revision) is None:
              raise SystemExit("manifest source revision is not a full lowercase Git SHA")
          if revision != os.environ.get("NIMBO_HANDOFF_SOURCE_REVISION"):
              raise SystemExit("unsigned handoff source revision mismatch")
          if not isinstance(artifacts, dict) or set(artifacts) != {
              "android_phone",
              "wear_os",
              "apple",
          }:
              raise SystemExit("manifest artifact inventory mismatch")
          bindings = {
              "android_phone": ("NIMBO_HANDOFF_PHONE_FILENAME", "NIMBO_PHONE_FILENAME"),
              "wear_os": ("NIMBO_HANDOFF_WEAR_FILENAME", "NIMBO_WEAR_FILENAME"),
              "apple": ("NIMBO_HANDOFF_APPLE_FILENAME", "NIMBO_APPLE_FILENAME"),
          }
          for artifact_id, (handoff_name, output_name) in bindings.items():
              artifact = artifacts.get(artifact_id)
              filename = artifact.get("filename") if isinstance(artifact, dict) else None
              if (
                  not isinstance(filename, str)
                  or re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}", filename) is None
                  or filename != os.environ.get(handoff_name)
              ):
                  raise SystemExit(f"{artifact_id} filename handoff mismatch")
              print(f"{output_name}={filename}")
          PY
          source_root="$RUNNER_TEMP/nimbo-release-source"
          unsigned_root="$RUNNER_TEMP/nimbo-unsigned-inputs"
          package_root="$RUNNER_TEMP/nimbo-signed-candidate-package"
          artifact_root="$package_root/bytes"
          bundletool="$RUNNER_TEMP/bundletool-all-1.18.3.jar"
          verifier_root="$RUNNER_TEMP/nimbo-reviewed-verifier"
          git worktree add --detach "$source_root" "$source_revision"
          install -d -m 700 \
            "$unsigned_root" \
            "$package_root" \
            "$artifact_root" \
            "$verifier_root"
          [[ "$(shasum -a 256 "$GITHUB_WORKSPACE/scripts/verify_signed_candidate.py" | awk '{print $1}')" == \
            "1294eec2eb8a0c0a1ff928bf2963a46dcbc600b42eaa840c53f3c5ec537956fa" ]]
          [[ "$(shasum -a 256 "$GITHUB_WORKSPACE/scripts/release_artifact_verifier.py" | awk '{print $1}')" == \
            "8b99c81951002b19cb6d0c096871e36f222ec2df6fac762603442e194fc41a99" ]]
          install -m 500 \
            "$GITHUB_WORKSPACE/scripts/verify_signed_candidate.py" \
            "$verifier_root/verify_signed_candidate.py"
          install -m 400 \
            "$GITHUB_WORKSPACE/scripts/release_artifact_verifier.py" \
            "$verifier_root/release_artifact_verifier.py"
          cd "$RUNNER_TEMP/nimbo-unsigned-download"
          shasum -a 256 --check nimbo-unsigned-inputs.sha256
          python3 - "$unsigned_root" <<'PY'
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          destination = Path(sys.argv[1])
          expected_roots = {
              "phone-unsigned.aab",
              "wear-unsigned.aab",
              "phone-mapping.txt",
              "ExportOptions.plist",
              "Nimbo.xcarchive",
          }
          with tarfile.open("nimbo-unsigned-inputs.tar.gz", "r:gz") as archive:
              members = archive.getmembers()
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not path.parts:
                      raise SystemExit("unsafe unsigned-input archive path")
                  if path.parts[0] not in expected_roots:
                      raise SystemExit("unexpected unsigned-input archive root")
                  if not (member.isfile() or member.isdir()):
                      raise SystemExit("unsupported unsigned-input archive entry")
              archive.extractall(destination, filter="data")
          if {entry.name for entry in destination.iterdir()} != expected_roots:
              raise SystemExit("unsigned-input archive inventory mismatch")
          export_options = dict([
              ("destination", "export"),
              ("manageAppVersionAndBuildNumber", False),
              ("method", "app-store-connect"),
              ("provisioningProfiles", dict([
                  ("uz.ganikhodjaev.weather", (
                      "iOS Team Store Provisioning Profile: uz.ganikhodjaev.weather"
                  )),
                  ("uz.ganikhodjaev.weather.watchkitapp", (
                      "iOS Team Store Provisioning Profile: "
                      "uz.ganikhodjaev.weather.watchkitapp"
                  )),
                  ("uz.ganikhodjaev.weather.widget", (
                      "iOS Team Store Provisioning Profile: "
                      "uz.ganikhodjaev.weather.widget"
                  )),
              ])),
              ("signingCertificate", "Apple Distribution"),
              ("signingStyle", "manual"),
              ("teamID", "5SWEZ7HTYP"),
              ("uploadSymbols", True),
          ])
          import plistlib

          actual_export_options = plistlib.loads(
              (destination / "ExportOptions.plist").read_bytes()
          )
          if actual_export_options != export_options:
              raise SystemExit(
                  "ExportOptions.plist differs from the non-upload canonical contract"
              )
          PY
          {
            echo "NIMBO_SOURCE_REVISION=$source_revision"
            echo "NIMBO_SOURCE_ROOT=$source_root"
            echo "NIMBO_UNSIGNED_ROOT=$unsigned_root"
            echo "NIMBO_PACKAGE_ROOT=$package_root"
            echo "NIMBO_ARTIFACT_ROOT=$artifact_root"
            echo "NIMBO_BUNDLETOOL_JAR=$bundletool"
            echo "NIMBO_VERIFIER_ROOT=$verifier_root"
          } >> "$GITHUB_ENV"

      - name: Fetch pinned Bundletool
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar" \
            --output "$NIMBO_BUNDLETOOL_JAR"
          echo "a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  $NIMBO_BUNDLETOOL_JAR" \
            | shasum -a 256 --check
          java -jar "$NIMBO_BUNDLETOOL_JAR" version | grep -Fx "1.18.3"

      - name: Decode protected signing material outside the checkout
        shell: bash
        env:
          NIMBO_ANDROID_KEYSTORE_B64: ${{ secrets.NIMBO_ANDROID_UPLOAD_KEYSTORE_B64 }}
          NIMBO_APPLE_P12_B64: ${{ secrets.NIMBO_APPLE_DISTRIBUTION_P12_B64 }}
          NIMBO_APPLE_APP_PROFILE_B64: ${{ secrets.NIMBO_APPLE_APP_PROFILE_B64 }}
          NIMBO_APPLE_WIDGET_PROFILE_B64: ${{ secrets.NIMBO_APPLE_WIDGET_PROFILE_B64 }}
          NIMBO_APPLE_WATCH_PROFILE_B64: ${{ secrets.NIMBO_APPLE_WATCH_PROFILE_B64 }}
        run: |
          set +x
          set -euo pipefail
          : "${NIMBO_ANDROID_KEYSTORE_B64:?missing Android keystore}"
          : "${NIMBO_APPLE_P12_B64:?missing Apple identity}"
          : "${NIMBO_APPLE_APP_PROFILE_B64:?missing app profile}"
          : "${NIMBO_APPLE_WIDGET_PROFILE_B64:?missing widget profile}"
          : "${NIMBO_APPLE_WATCH_PROFILE_B64:?missing watch profile}"
          signing_root="$RUNNER_TEMP/nimbo-signing-material"
          install -d -m 700 "$signing_root"
          echo "NIMBO_SIGNING_ROOT=$signing_root" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "nimbo-signing-material"
          outputs = {
              "NIMBO_ANDROID_KEYSTORE_B64": "android-upload.p12",
              "NIMBO_APPLE_P12_B64": "apple-distribution.p12",
              "NIMBO_APPLE_APP_PROFILE_B64": "app.mobileprovision",
              "NIMBO_APPLE_WIDGET_PROFILE_B64": "widget.mobileprovision",
              "NIMBO_APPLE_WATCH_PROFILE_B64": "watch.mobileprovision",
          }
          for variable, filename in outputs.items():
              encoded = "".join(os.environ[variable].split())
              payload = base64.b64decode(encoded, validate=True)
              if not payload:
                  raise SystemExit(f"{variable} decoded to an empty file")
              destination = root / filename
              destination.write_bytes(payload)
              destination.chmod(0o600)
          PY

      - name: Upload-sign Android phone and Wear bundles
        shell: bash
        env:
          NIMBO_ANDROID_STORE_PASSWORD: ${{ secrets.NIMBO_ANDROID_UPLOAD_STORE_PASSWORD }}
          NIMBO_ANDROID_KEY_PASSWORD: ${{ secrets.NIMBO_ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          : "${NIMBO_ANDROID_STORE_PASSWORD:?missing Android store password}"
          : "${NIMBO_ANDROID_KEY_PASSWORD:?missing Android key password}"
          phone_output="$NIMBO_ARTIFACT_ROOT/$NIMBO_PHONE_FILENAME"
          wear_output="$NIMBO_ARTIFACT_ROOT/$NIMBO_WEAR_FILENAME"
          printf '%s\n%s\n' \
            "$NIMBO_ANDROID_STORE_PASSWORD" \
            "$NIMBO_ANDROID_KEY_PASSWORD" \
            | "$JAVA_HOME/bin/jarsigner" \
                -keystore "$NIMBO_SIGNING_ROOT/android-upload.p12" \
                -storetype PKCS12 \
                -sigalg SHA256withRSA \
                -digestalg SHA-256 \
                -signedjar "$phone_output" \
                "$NIMBO_UNSIGNED_ROOT/phone-unsigned.aab" \
                weather
          printf '%s\n%s\n' \
            "$NIMBO_ANDROID_STORE_PASSWORD" \
            "$NIMBO_ANDROID_KEY_PASSWORD" \
            | "$JAVA_HOME/bin/jarsigner" \
                -keystore "$NIMBO_SIGNING_ROOT/android-upload.p12" \
                -storetype PKCS12 \
                -sigalg SHA256withRSA \
                -digestalg SHA-256 \
                -signedjar "$wear_output" \
                "$NIMBO_UNSIGNED_ROOT/wear-unsigned.aab" \
                weather
          unset NIMBO_ANDROID_STORE_PASSWORD NIMBO_ANDROID_KEY_PASSWORD
          cp "$NIMBO_UNSIGNED_ROOT/phone-mapping.txt" \
            "${phone_output%.aab}-mapping.txt"

      - name: Install ephemeral Apple identity and exact profiles
        shell: bash
        env:
          NIMBO_APPLE_P12_PASSWORD: ${{ secrets.NIMBO_APPLE_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set +x
          set -euo pipefail
          : "${NIMBO_APPLE_P12_PASSWORD:?missing Apple identity password}"
          keychain="$RUNNER_TEMP/nimbo-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          echo "NIMBO_EPHEMERAL_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$NIMBO_SIGNING_ROOT/apple-distribution.p12" \
            -k "$keychain" \
            -P "$NIMBO_APPLE_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-certificate -c "Apple Distribution" -p "$keychain" \
            > "$RUNNER_TEMP/nimbo-apple-distribution.pem"
          actual_certificate_sha="$(
            openssl x509 \
              -in "$RUNNER_TEMP/nimbo-apple-distribution.pem" \
              -outform DER \
              | shasum -a 256 \
              | awk '{print $1}'
          )"
          expected_certificate_sha="fd4d8668a7e0f4eb9f64a12b5f0ddec0075ccde31dad50a96e978926e0e743f1"
          [[ "$actual_certificate_sha" == "$expected_certificate_sha" ]]
          profiles_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          install -d -m 700 "$profiles_dir"
          : > "$RUNNER_TEMP/nimbo-installed-profiles.txt"
          while IFS='|' read -r source expected_name bundle_id; do
            decoded="$RUNNER_TEMP/$(basename "$source").plist"
            security cms -D -i "$source" > "$decoded"
            uuid="$(python3 - "$decoded" "$expected_name" "$bundle_id" <<'PY'
          import datetime
          import plistlib
          import sys
          from pathlib import Path

          profile = plistlib.loads(Path(sys.argv[1]).read_bytes())
          expected_name = sys.argv[2]
          bundle_id = sys.argv[3]
          team_id = "5SWEZ7HTYP"
          if profile.get("Name") != expected_name:
              raise SystemExit("provisioning profile name mismatch")
          if profile.get("TeamIdentifier") != [team_id]:
              raise SystemExit("provisioning profile team mismatch")
          expiration = profile.get("ExpirationDate")
          now = datetime.datetime.now(datetime.timezone.utc)
          if expiration is None:
              raise SystemExit("provisioning profile expiration is missing")
          if expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=datetime.timezone.utc)
          if expiration <= now:
              raise SystemExit("provisioning profile is expired")
          entitlements = profile.get("Entitlements", {})
          if entitlements.get("application-identifier") != f"{team_id}.{bundle_id}":
              raise SystemExit("provisioning profile application identifier mismatch")
          if entitlements.get("get-task-allow") is not False:
              raise SystemExit("provisioning profile is not distribution-scoped")
          if entitlements.get("beta-reports-active") is not True:
              raise SystemExit("provisioning profile is not App Store scoped")
          uuid = profile.get("UUID")
          if not isinstance(uuid, str) or not uuid:
              raise SystemExit("provisioning profile UUID is missing")
          print(uuid)
          PY
            )"
            installed="$profiles_dir/$uuid.mobileprovision"
            cp "$source" "$installed"
            printf '%s\n' "$installed" >> "$RUNNER_TEMP/nimbo-installed-profiles.txt"
          done <<EOF
          $NIMBO_SIGNING_ROOT/app.mobileprovision|iOS Team Store Provisioning Profile: uz.ganikhodjaev.weather|uz.ganikhodjaev.weather
          $NIMBO_SIGNING_ROOT/widget.mobileprovision|iOS Team Store Provisioning Profile: uz.ganikhodjaev.weather.widget|uz.ganikhodjaev.weather.widget
          $NIMBO_SIGNING_ROOT/watch.mobileprovision|iOS Team Store Provisioning Profile: uz.ganikhodjaev.weather.watchkitapp|uz.ganikhodjaev.weather.watchkitapp
          EOF
          unset NIMBO_APPLE_P12_PASSWORD keychain_password

      - name: Export and retain distribution-signed Apple build 6
        shell: bash
        run: |
          set -euo pipefail
          ditto "$NIMBO_UNSIGNED_ROOT/Nimbo.xcarchive" \
            "$NIMBO_ARTIFACT_ROOT/Nimbo.xcarchive"
          cp "$NIMBO_UNSIGNED_ROOT/ExportOptions.plist" \
            "$NIMBO_ARTIFACT_ROOT/ExportOptions.plist"
          export_root="$RUNNER_TEMP/nimbo-app-store-export"
          xcodebuild \
            -exportArchive \
            -archivePath "$NIMBO_ARTIFACT_ROOT/Nimbo.xcarchive" \
            -exportPath "$export_root" \
            -exportOptionsPlist "$NIMBO_ARTIFACT_ROOT/ExportOptions.plist"
          ipa_count="$(find "$export_root" -maxdepth 1 -type f -name '*.ipa' | wc -l | tr -d ' ')"
          [[ "$ipa_count" == "1" ]]
          find "$export_root" -maxdepth 1 -type f -name '*.ipa' \
            -exec cp {} "$NIMBO_ARTIFACT_ROOT/$NIMBO_APPLE_FILENAME" \;
          exported_root="$RUNNER_TEMP/nimbo-exported-ipa"
          install -d -m 700 "$exported_root"
          ditto -x -k \
            "$NIMBO_ARTIFACT_ROOT/$NIMBO_APPLE_FILENAME" \
            "$exported_root"
          archive_app="$NIMBO_ARTIFACT_ROOT/Nimbo.xcarchive/Products/Applications/Nimbo.app"
          [[ "$archive_app" == "$RUNNER_TEMP/nimbo-signed-candidate-package/bytes/Nimbo.xcarchive/Products/Applications/Nimbo.app" ]]
          rm -rf -- "$archive_app"
          ditto "$exported_root/Payload/Nimbo.app" "$archive_app"
          python3 - "$NIMBO_ARTIFACT_ROOT/Nimbo.xcarchive/Info.plist" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          archive = plistlib.loads(path.read_bytes())
          properties = archive.setdefault("ApplicationProperties", {})
          properties["CFBundleIdentifier"] = "uz.ganikhodjaev.weather"
          properties["CFBundleShortVersionString"] = "1.1.0"
          properties["CFBundleVersion"] = "6"
          properties["Team"] = "5SWEZ7HTYP"
          path.write_bytes(plistlib.dumps(archive, sort_keys=False))
          PY

      - name: Destroy signing material before byte verification
        shell: bash
        run: |
          set +x
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/nimbo-installed-profiles.txt" ]]; then
            while IFS= read -r profile; do
              case "$profile" in
                "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision)
                  rm -f -- "$profile"
                  ;;
                *)
                  exit 1
                  ;;
              esac
            done < "$RUNNER_TEMP/nimbo-installed-profiles.txt"
          fi
          [[ "${NIMBO_EPHEMERAL_KEYCHAIN:-}" == "$RUNNER_TEMP/nimbo-signing.keychain-db" ]]
          security delete-keychain "$NIMBO_EPHEMERAL_KEYCHAIN"
          rm -f -- \
            "$RUNNER_TEMP/nimbo-apple-distribution.pem" \
            "$RUNNER_TEMP/nimbo-installed-profiles.txt" \
            "$RUNNER_TEMP/app.mobileprovision.plist" \
            "$RUNNER_TEMP/widget.mobileprovision.plist" \
            "$RUNNER_TEMP/watch.mobileprovision.plist"
          [[ "${NIMBO_SIGNING_ROOT:-}" == "$RUNNER_TEMP/nimbo-signing-material" ]]
          rm -rf -- "$NIMBO_SIGNING_ROOT"
          [[ ! -e "$NIMBO_EPHEMERAL_KEYCHAIN" ]]
          [[ ! -e "$NIMBO_SIGNING_ROOT" ]]
          {
            echo "NIMBO_EPHEMERAL_KEYCHAIN="
            echo "NIMBO_SIGNING_ROOT="
          } >> "$GITHUB_ENV"

      - name: Byte-verify the complete signed candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(shasum -a 256 "$NIMBO_VERIFIER_ROOT/verify_signed_candidate.py" | awk '{print $1}')" == \
            "1294eec2eb8a0c0a1ff928bf2963a46dcbc600b42eaa840c53f3c5ec537956fa" ]]
          [[ "$(shasum -a 256 "$NIMBO_VERIFIER_ROOT/release_artifact_verifier.py" | awk '{print $1}')" == \
            "8b99c81951002b19cb6d0c096871e36f222ec2df6fac762603442e194fc41a99" ]]
          python3 -I -B - \
            "$NIMBO_VERIFIER_ROOT" \
            --repository-root "$GITHUB_WORKSPACE" \
            --source-root "$NIMBO_SOURCE_ROOT" \
            --manifest "$GITHUB_WORKSPACE/store/upload-manifest-1.1.0.json" \
            --artifact-root "$NIMBO_ARTIFACT_ROOT" \
            --bundletool-jar "$NIMBO_BUNDLETOOL_JAR" \
            --output "$NIMBO_PACKAGE_ROOT/signed-candidate-receipt.json" \
            --package-output "$NIMBO_PACKAGE_ROOT/signed-candidate-bytes.tar.gz" <<'PY'
          import runpy
          import sys
          from pathlib import Path

          verifier_root = Path(sys.argv[1])
          arguments = sys.argv[2:]
          sys.path.insert(0, str(verifier_root))
          script = verifier_root / "verify_signed_candidate.py"
          sys.argv = [str(script)] + arguments
          runpy.run_path(str(script), run_name="__main__")
          PY
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          receipt = json.loads(
              (Path(os.environ["NIMBO_PACKAGE_ROOT"]) / "signed-candidate-receipt.json").read_text()
          )
          if receipt.get("state") != "candidate-bytes-verified-not-manifest-promoted":
              raise SystemExit("signed candidate receipt did not close byte verification")
          if receipt.get("schema_version") != 2:
              raise SystemExit("signed candidate receipt schema mismatch")
          artifacts = receipt.get("artifacts")
          if not isinstance(artifacts, dict) or set(artifacts) != {
              "android_phone",
              "wear_os",
              "apple",
          }:
              raise SystemExit("signed candidate receipt artifact inventory mismatch")
          if not all(
              artifact.get("byte_verified") is True
              for artifact in artifacts.values()
          ):
              raise SystemExit("not every signed candidate artifact was byte-verified")
          package = receipt.get("package", {})
          if package.get("filename") != "signed-candidate-bytes.tar.gz":
              raise SystemExit("signed candidate package was not receipt-bound")
          package_path = Path(os.environ["NIMBO_PACKAGE_ROOT"]) / package["filename"]
          digest = hashlib.sha256(package_path.read_bytes()).hexdigest()
          if digest != package.get("sha256"):
              raise SystemExit("signed candidate package digest mismatch")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: nimbo-signed-candidate-${{ needs.build-unsigned.outputs.source_revision }}
          path: |
            ${{ runner.temp }}/nimbo-signed-candidate-package/signed-candidate-bytes.tar.gz
            ${{ runner.temp }}/nimbo-signed-candidate-package/signed-candidate-receipt.json
          if-no-files-found: error
          retention-days: 7

      - name: Destroy ephemeral signing material
        if: always()
        shell: bash
        run: |
          set +e
          set +x
          if [[ -f "$RUNNER_TEMP/nimbo-installed-profiles.txt" ]]; then
            while IFS= read -r profile; do
              case "$profile" in
                "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision)
                  rm -f -- "$profile"
                  ;;
              esac
            done < "$RUNNER_TEMP/nimbo-installed-profiles.txt"
          fi
          if [[ -n "${NIMBO_EPHEMERAL_KEYCHAIN:-}" ]]; then
            security delete-keychain "$NIMBO_EPHEMERAL_KEYCHAIN"
          fi
          rm -f -- \
            "$RUNNER_TEMP/nimbo-apple-distribution.pem" \
            "$RUNNER_TEMP/nimbo-installed-profiles.txt" \
            "$RUNNER_TEMP/app.mobileprovision.plist" \
            "$RUNNER_TEMP/widget.mobileprovision.plist" \
            "$RUNNER_TEMP/watch.mobileprovision.plist"
          if [[ -n "${NIMBO_SIGNING_ROOT:-}" && "$NIMBO_SIGNING_ROOT" == "$RUNNER_TEMP/nimbo-signing-material" ]]; then
            rm -rf -- "$NIMBO_SIGNING_ROOT"
          fi
          if [[ -n "${NIMBO_SOURCE_ROOT:-}" && "$NIMBO_SOURCE_ROOT" == "$RUNNER_TEMP/nimbo-release-source" ]]; then
            git worktree remove --force "$NIMBO_SOURCE_ROOT"
          fi
          if [[ -n "${NIMBO_VERIFIER_ROOT:-}" && "$NIMBO_VERIFIER_ROOT" == "$RUNNER_TEMP/nimbo-reviewed-verifier" ]]; then
            rm -rf -- "$NIMBO_VERIFIER_ROOT"
          fi
