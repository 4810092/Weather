name: Materialize signed candidate

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: release-materialization-33616952267
  cancel-in-progress: false

jobs:
  materialize:
    if: github.repository == '4810092/Weather' && github.repository_id == '1329018769' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate immutable source provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          metadata_root="$RUNNER_TEMP/nimbo-materialization-metadata"
          install -d -m 700 "$metadata_root"
          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            repos/4810092/Weather/actions/runs/33616952267 \
            > "$metadata_root/run.json"
          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            repos/4810092/Weather/actions/artifacts/9842047484 \
            > "$metadata_root/artifact.json"
          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'repos/4810092/Weather/contents/.github/workflows/signed-candidate.yml?ref=0b7104aa69430306fb06af40d504400bd17fb320' \
            > "$metadata_root/workflow.json"
          python3 -I - "$metadata_root" <<'PY'
          import base64
          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          run = json.loads((root / "run.json").read_text())
          artifact = json.loads((root / "artifact.json").read_text())
          workflow = json.loads((root / "workflow.json").read_text())

          expected_run = {
              "id": 33616952267,
              "run_attempt": 1,
              "status": "completed",
              "conclusion": "success",
              "event": "workflow_dispatch",
              "head_branch": "master",
              "head_sha": "0b7104aa69430306fb06af40d504400bd17fb320",
              "path": ".github/workflows/signed-candidate.yml",
              "workflow_id": 345674745,
          }
          for key, value in expected_run.items():
              if run.get(key) != value:
                  raise SystemExit(f"source run {key} mismatch")

          expected_artifact = {
              "id": 9842047484,
              "name": (
                  "nimbo-signed-candidate-"
                  "052d12c7dfa6411428d85205d9568462d20ff87d"
              ),
              "size_in_bytes": 57940467,
              "digest": (
                  "sha256:"
                  "2dfe19c9d2e1ab06d161e35cb4aa579659444ef745dde9ea91de8984d7e9f1a0"
              ),
              "expired": False,
          }
          for key, value in expected_artifact.items():
              if artifact.get(key) != value:
                  raise SystemExit(f"source artifact {key} mismatch")
          artifact_run = artifact.get("workflow_run")
          if not isinstance(artifact_run, dict):
              raise SystemExit("source artifact workflow binding is missing")
          expected_artifact_run = {
              "id": 33616952267,
              "repository_id": 1329018769,
              "head_repository_id": 1329018769,
              "head_branch": "master",
              "head_sha": "0b7104aa69430306fb06af40d504400bd17fb320",
          }
          for key, value in expected_artifact_run.items():
              if artifact_run.get(key) != value:
                  raise SystemExit(f"source artifact run {key} mismatch")

          if workflow.get("path") != ".github/workflows/signed-candidate.yml":
              raise SystemExit("source workflow path mismatch")
          if workflow.get("sha") is None:
              raise SystemExit("source workflow Git blob identity is missing")
          try:
              workflow_bytes = base64.b64decode(
                  workflow["content"],
                  validate=False,
              )
          except (KeyError, TypeError, ValueError) as error:
              raise SystemExit("source workflow bytes are unavailable") from error
          workflow_digest = hashlib.sha256(workflow_bytes).hexdigest()
          if workflow_digest != (
              "877ffa2656f160b4699de88020bb4952e0ffaa3ae00febdf4c1d6e85acf116d7"
          ):
              raise SystemExit("source workflow digest mismatch")
          PY

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: "9842047484"
          github-token: ${{ github.token }}
          repository: 4810092/Weather
          run-id: "33616952267"
          path: ${{ runner.temp }}/nimbo-materialization-download
          skip-decompress: "true"
          digest-mismatch: error

      - name: Verify and stage exact candidate assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - "$RUNNER_TEMP" <<'PY'
          import hashlib
          import json
          import stat
          import sys
          import tarfile
          import zipfile
          from pathlib import Path, PurePosixPath

          runner_temp = Path(sys.argv[1])
          download_root = runner_temp / "nimbo-materialization-download"
          entries = list(download_root.iterdir())
          if len(entries) != 1:
              raise SystemExit("downloaded artifact inventory mismatch")
          source_zip = entries[0]
          if source_zip.is_symlink() or not source_zip.is_file():
              raise SystemExit("downloaded artifact must be one regular file")
          if source_zip.stat().st_size != 57940467:
              raise SystemExit("downloaded artifact size mismatch")
          if hashlib.sha256(source_zip.read_bytes()).hexdigest() != (
              "2dfe19c9d2e1ab06d161e35cb4aa579659444ef745dde9ea91de8984d7e9f1a0"
          ):
              raise SystemExit("downloaded artifact digest mismatch")

          expected = {
              "signed-candidate-receipt.json": {
                  "size": 11716,
                  "compressed_size": 2497,
                  "sha256": (
                      "51fc10894dc9c0ff99c528a9778b01e4f78cf8354a13ca300d449c9b8fca4072"
                  ),
              },
              "signed-candidate-bytes.tar.gz": {
                  "size": 58208833,
                  "compressed_size": 57937648,
                  "sha256": (
                      "5b8186e0aaa1d1ba74d475ba462d545fe2f3da1a321f77fbab3f7663df021d64"
                  ),
              },
          }
          asset_root = runner_temp / "nimbo-draft-release-assets"
          asset_root.mkdir(mode=0o700)
          with zipfile.ZipFile(source_zip) as archive:
              infos = archive.infolist()
              if [info.filename for info in infos] != list(expected):
                  raise SystemExit("candidate ZIP inventory or order mismatch")
              if len({info.filename for info in infos}) != len(infos):
                  raise SystemExit("candidate ZIP contains duplicate names")
              for info in infos:
                  specification = expected[info.filename]
                  mode = info.external_attr >> 16
                  if (
                      info.is_dir()
                      or info.flag_bits & 0x1
                      or info.compress_type != zipfile.ZIP_DEFLATED
                      or stat.S_IFMT(mode) != stat.S_IFREG
                      or info.file_size != specification["size"]
                      or info.compress_size != specification["compressed_size"]
                  ):
                      raise SystemExit(f"unsafe or unexpected ZIP entry: {info.filename}")
                  destination = asset_root / info.filename
                  digest = hashlib.sha256()
                  size = 0
                  with archive.open(info, "r") as source, destination.open("xb") as output:
                      while chunk := source.read(1024 * 1024):
                          digest.update(chunk)
                          size += len(chunk)
                          output.write(chunk)
                  if size != specification["size"]:
                      raise SystemExit(f"extracted size mismatch: {info.filename}")
                  if digest.hexdigest() != specification["sha256"]:
                      raise SystemExit(f"extracted digest mismatch: {info.filename}")

          receipt = json.loads(
              (asset_root / "signed-candidate-receipt.json").read_text()
          )
          package_path = asset_root / "signed-candidate-bytes.tar.gz"
          with tarfile.open(package_path, "r:gz") as package_archive:
              package_members = package_archive.getmembers()
          package_names = [member.name for member in package_members]
          if len(package_members) != 192 or len(set(package_names)) != 192:
              raise SystemExit("candidate package member inventory mismatch")
          if sum(member.isfile() for member in package_members) != 104:
              raise SystemExit("candidate package regular-file count mismatch")
          if sum(member.isdir() for member in package_members) != 88:
              raise SystemExit("candidate package directory count mismatch")
          if sum(member.size for member in package_members if member.isfile()) != 152287399:
              raise SystemExit("candidate package expanded size mismatch")
          for member in package_members:
              path = PurePosixPath(member.name)
              if (
                  path.is_absolute()
                  or not path.parts
                  or path.parts[0] != "bytes"
                  or ".." in path.parts
                  or not (member.isfile() or member.isdir())
              ):
                  raise SystemExit(f"unsafe candidate package member: {member.name}")
          expected_package_files = {
              "bytes/ExportOptions.plist": 988,
              "bytes/Nimbo.ipa": 22747241,
              "bytes/nimbo-phone-1.1.0-vc11-mapping.txt": 42367345,
              "bytes/nimbo-phone-1.1.0-vc11.aab": 5591748,
              "bytes/nimbo-wear-1.1.0-vc1000011.aab": 2595787,
          }
          package_by_name = {member.name: member for member in package_members}
          for name, size in expected_package_files.items():
              member = package_by_name.get(name)
              if member is None or not member.isfile() or member.size != size:
                  raise SystemExit(f"candidate package required file mismatch: {name}")
          if receipt.get("schema_version") != 3:
              raise SystemExit("candidate receipt schema mismatch")
          if receipt.get("state") != "candidate-bytes-verified-not-manifest-promoted":
              raise SystemExit("candidate receipt state mismatch")
          if receipt.get("source_revision") != (
              "052d12c7dfa6411428d85205d9568462d20ff87d"
          ):
              raise SystemExit("candidate receipt source mismatch")
          provenance = receipt.get("provenance", {})
          if provenance.get("provider") != "github-actions":
              raise SystemExit("candidate receipt provider mismatch")
          if provenance.get("run") != {"attempt": 1, "id": 33616952267}:
              raise SystemExit("candidate receipt run mismatch")
          if provenance.get("source") != {
              "head_sha": "0b7104aa69430306fb06af40d504400bd17fb320",
              "ref": "refs/heads/master",
          }:
              raise SystemExit("candidate receipt workflow source mismatch")
          if provenance.get("workflow") != {
              "path": ".github/workflows/signed-candidate.yml",
              "sha256": (
                  "877ffa2656f160b4699de88020bb4952e0ffaa3ae00febdf4c1d6e85acf116d7"
              ),
          }:
              raise SystemExit("candidate receipt workflow mismatch")
          package = receipt.get("package", {})
          if package != {
              "candidate_tree_sha256": (
                  "b69d7d124c8160ee2af68667ecbd74d2f90bf72cec77b06c4a80b7ad31e55f12"
              ),
              "filename": "signed-candidate-bytes.tar.gz",
              "format": "tar.gz",
              "sha256": (
                  "5b8186e0aaa1d1ba74d475ba462d545fe2f3da1a321f77fbab3f7663df021d64"
              ),
          }:
              raise SystemExit("candidate receipt package binding mismatch")
          expected_artifact_digests = {
              "android_phone": (
                  "034aa0a732e0a671c341e6714162a2d22c95d06435aa327bd17b1d7b3da2f9ac"
              ),
              "wear_os": (
                  "48a713d298be12552f08995b7cff3166df0f4ab173c62612854598eb93dcab7a"
              ),
              "apple": (
                  "a57674d7d467474a0697fb39c834a9829f53e68ddb9d4480168bf2dcf3f7ac29"
              ),
          }
          artifacts = receipt.get("artifacts")
          if not isinstance(artifacts, dict) or set(artifacts) != set(
              expected_artifact_digests
          ):
              raise SystemExit("candidate receipt artifact inventory mismatch")
          for artifact_id, digest in expected_artifact_digests.items():
              artifact = artifacts[artifact_id]
              if (
                  artifact.get("byte_verified") is not True
                  or artifact.get("source_sync") != "candidate-verified"
                  or artifact.get("sha256") != digest
              ):
                  raise SystemExit(f"candidate receipt artifact mismatch: {artifact_id}")
          PY

      - name: Create or reuse exact unpublished draft
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          set -euo pipefail
          release_root="$RUNNER_TEMP/nimbo-materialization-release"
          install -d -m 700 "$release_root"
          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'repos/4810092/Weather/releases?per_page=100' \
            > "$release_root/release-pages.json"
          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'repos/4810092/Weather/git/matching-refs/tags/nimbo-candidate-v1.1.0-052d12c-run-33616952267' \
            > "$release_root/tags-before.json"
          python3 -I - "$release_root" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          if json.loads((root / "tags-before.json").read_text()) != []:
              raise SystemExit("candidate storage tag already exists")
          pages = json.loads((root / "release-pages.json").read_text())
          releases = [release for page in pages for release in page]
          tag = "nimbo-candidate-v1.1.0-052d12c-run-33616952267"
          matches = [release for release in releases if release.get("tag_name") == tag]
          if len(matches) > 1:
              raise SystemExit("duplicate candidate draft releases exist")
          body = """Internal artifact storage only. Do not publish.

          This draft is not store submission, review, publication, physical QA, or ranking evidence.

          - Product source: `052d12c7dfa6411428d85205d9568462d20ff87d`
          - Signing run: `33616952267` attempt `1`
          - Signing workflow head: `0b7104aa69430306fb06af40d504400bd17fb320`
          - Source artifact: `9842047484`
          - Source artifact SHA-256: `2dfe19c9d2e1ab06d161e35cb4aa579659444ef745dde9ea91de8984d7e9f1a0`
          - Candidate package SHA-256: `5b8186e0aaa1d1ba74d475ba462d545fe2f3da1a321f77fbab3f7663df021d64`
          - Candidate receipt SHA-256: `51fc10894dc9c0ff99c528a9778b01e4f78cf8354a13ca300d449c9b8fca4072`
          """
          expected = {
              "tag_name": tag,
              "target_commitish": os.environ["GITHUB_SHA"],
              "name": "[DRAFT STORAGE] Nimbo 1.1.0 signed candidate 052d12c",
              "body": body,
              "draft": True,
              "prerelease": True,
          }
          if matches:
              release = matches[0]
              for key, value in expected.items():
                  if release.get(key) != value:
                      raise SystemExit(f"existing candidate draft {key} mismatch")
              if release.get("published_at") is not None:
                  raise SystemExit("existing candidate draft is published")
              (root / "release.json").write_text(
                  json.dumps(release, sort_keys=True) + "\n"
              )
              (root / "decision.txt").write_text("reuse\n")
          else:
              payload = dict(expected)
              payload["generate_release_notes"] = False
              payload["make_latest"] = "false"
              (root / "create-release.json").write_text(
                  json.dumps(payload, sort_keys=True) + "\n"
              )
              (root / "decision.txt").write_text("create\n")
          PY
          if [[ "$(<"$release_root/decision.txt")" == "create" ]]; then
            gh api \
              --method POST \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              repos/4810092/Weather/releases \
              --input "$release_root/create-release.json" \
              > "$release_root/release.json"
          fi
          python3 -I - "$release_root" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          release = json.loads((root / "release.json").read_text())
          body = """Internal artifact storage only. Do not publish.

          This draft is not store submission, review, publication, physical QA, or ranking evidence.

          - Product source: `052d12c7dfa6411428d85205d9568462d20ff87d`
          - Signing run: `33616952267` attempt `1`
          - Signing workflow head: `0b7104aa69430306fb06af40d504400bd17fb320`
          - Source artifact: `9842047484`
          - Source artifact SHA-256: `2dfe19c9d2e1ab06d161e35cb4aa579659444ef745dde9ea91de8984d7e9f1a0`
          - Candidate package SHA-256: `5b8186e0aaa1d1ba74d475ba462d545fe2f3da1a321f77fbab3f7663df021d64`
          - Candidate receipt SHA-256: `51fc10894dc9c0ff99c528a9778b01e4f78cf8354a13ca300d449c9b8fca4072`
          """
          expected = {
              "tag_name": "nimbo-candidate-v1.1.0-052d12c-run-33616952267",
              "target_commitish": os.environ["GITHUB_SHA"],
              "name": "[DRAFT STORAGE] Nimbo 1.1.0 signed candidate 052d12c",
              "body": body,
              "draft": True,
              "prerelease": True,
              "published_at": None,
          }
          for key, value in expected.items():
              if release.get(key) != value:
                  raise SystemExit(f"candidate draft {key} mismatch")
          release_id = release.get("id")
          if not isinstance(release_id, int) or release_id <= 0:
              raise SystemExit("candidate draft release ID is invalid")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"release_id={release_id}\n")
          PY

      - name: Upload only missing exact assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIMBO_RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set +x
          set -euo pipefail
          release_root="$RUNNER_TEMP/nimbo-materialization-release"
          asset_root="$RUNNER_TEMP/nimbo-draft-release-assets"
          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/4810092/Weather/releases/$NIMBO_RELEASE_ID/assets?per_page=100" \
            > "$release_root/asset-pages-before.json"
          python3 -I - "$release_root" <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          pages = json.loads((root / "asset-pages-before.json").read_text())
          assets = [asset for page in pages for asset in page]
          expected = {
              "signed-candidate-bytes.tar.gz": {
                  "size": 58208833,
                  "digest": (
                      "sha256:"
                      "5b8186e0aaa1d1ba74d475ba462d545fe2f3da1a321f77fbab3f7663df021d64"
                  ),
              },
              "signed-candidate-receipt.json": {
                  "size": 11716,
                  "digest": (
                      "sha256:"
                      "51fc10894dc9c0ff99c528a9778b01e4f78cf8354a13ca300d449c9b8fca4072"
                  ),
              },
          }
          if len({asset.get("name") for asset in assets}) != len(assets):
              raise SystemExit("candidate draft has duplicate asset names")
          if any(asset.get("name") not in expected for asset in assets):
              raise SystemExit("candidate draft has an unexpected asset")
          missing = []
          for name, specification in expected.items():
              matches = [asset for asset in assets if asset.get("name") == name]
              if not matches:
                  missing.append(name)
                  continue
              asset = matches[0]
              if (
                  asset.get("state") != "uploaded"
                  or asset.get("size") != specification["size"]
                  or asset.get("digest") != specification["digest"]
              ):
                  raise SystemExit(f"existing candidate asset mismatch: {name}")
          (root / "missing-assets.txt").write_text(
              "".join(f"{name}\n" for name in missing)
          )
          PY
          while IFS= read -r asset_name; do
            [[ -n "$asset_name" ]] || continue
            case "$asset_name" in
              signed-candidate-bytes.tar.gz)
                asset_path="$asset_root/$asset_name"
                ;;
              signed-candidate-receipt.json)
                asset_path="$asset_root/$asset_name"
                ;;
              *)
                echo "unexpected missing asset name" >&2
                exit 1
                ;;
            esac
            response_path="$release_root/upload-$asset_name.json"
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/octet-stream" \
              --data-binary "@$asset_path" \
              "https://uploads.github.com/repos/4810092/Weather/releases/$NIMBO_RELEASE_ID/assets?name=$asset_name" \
              > "$response_path"
            python3 -I - "$response_path" "$asset_path" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          response_path = Path(sys.argv[1])
          asset_path = Path(sys.argv[2])
          response = json.loads(response_path.read_text())
          digest = hashlib.sha256(asset_path.read_bytes()).hexdigest()
          if (
              response.get("name") != asset_path.name
              or response.get("state") != "uploaded"
              or response.get("size") != asset_path.stat().st_size
              or response.get("digest") != f"sha256:{digest}"
          ):
              raise SystemExit("uploaded candidate asset response mismatch")
          PY
          done < "$release_root/missing-assets.txt"

      - name: Verify exact unpublished materialization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NIMBO_RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          set +x
          set -euo pipefail
          release_root="$RUNNER_TEMP/nimbo-materialization-release"
          verification_root="$RUNNER_TEMP/nimbo-materialization-verification"
          install -d -m 700 "$verification_root"
          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/4810092/Weather/releases/$NIMBO_RELEASE_ID" \
            > "$release_root/release-final.json"
          gh api \
            --paginate \
            --slurp \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/4810092/Weather/releases/$NIMBO_RELEASE_ID/assets?per_page=100" \
            > "$release_root/asset-pages-final.json"
          gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            'repos/4810092/Weather/git/matching-refs/tags/nimbo-candidate-v1.1.0-052d12c-run-33616952267' \
            > "$release_root/tags-after.json"
          python3 -I - "$release_root" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          release = json.loads((root / "release-final.json").read_text())
          if (
              release.get("draft") is not True
              or release.get("prerelease") is not True
              or release.get("published_at") is not None
              or release.get("tag_name")
              != "nimbo-candidate-v1.1.0-052d12c-run-33616952267"
              or release.get("target_commitish") != os.environ["GITHUB_SHA"]
          ):
              raise SystemExit("candidate release is not the exact unpublished draft")
          if json.loads((root / "tags-after.json").read_text()) != []:
              raise SystemExit("draft materialization unexpectedly created a Git tag")
          pages = json.loads((root / "asset-pages-final.json").read_text())
          assets = [asset for page in pages for asset in page]
          expected = {
              "signed-candidate-bytes.tar.gz": {
                  "size": 58208833,
                  "digest": (
                      "sha256:"
                      "5b8186e0aaa1d1ba74d475ba462d545fe2f3da1a321f77fbab3f7663df021d64"
                  ),
              },
              "signed-candidate-receipt.json": {
                  "size": 11716,
                  "digest": (
                      "sha256:"
                      "51fc10894dc9c0ff99c528a9778b01e4f78cf8354a13ca300d449c9b8fca4072"
                  ),
              },
          }
          if len(assets) != len(expected):
              raise SystemExit("candidate draft asset count mismatch")
          if {asset.get("name") for asset in assets} != set(expected):
              raise SystemExit("candidate draft asset name set mismatch")
          rows = []
          for asset in assets:
              name = asset.get("name")
              if name not in expected:
                  raise SystemExit("candidate draft has an unexpected final asset")
              specification = expected[name]
              if (
                  asset.get("state") != "uploaded"
                  or asset.get("size") != specification["size"]
                  or asset.get("digest") != specification["digest"]
              ):
                  raise SystemExit(f"candidate final asset mismatch: {name}")
              asset_id = asset.get("id")
              if not isinstance(asset_id, int) or asset_id <= 0:
                  raise SystemExit("candidate final asset ID is invalid")
              rows.append(f"{asset_id}\t{name}\n")
          (root / "final-assets.tsv").write_text("".join(sorted(rows)))
          PY
          while IFS=$'\t' read -r asset_id asset_name; do
            [[ "$asset_id" =~ ^[0-9]+$ ]]
            case "$asset_name" in
              signed-candidate-bytes.tar.gz|signed-candidate-receipt.json)
                ;;
              *)
                echo "unexpected final asset name" >&2
                exit 1
                ;;
            esac
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              --proto '=https' \
              --proto-redir '=https' \
              --header "Accept: application/octet-stream" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/4810092/Weather/releases/assets/$asset_id" \
              > "$verification_root/$asset_name"
          done < "$release_root/final-assets.tsv"
          echo "5b8186e0aaa1d1ba74d475ba462d545fe2f3da1a321f77fbab3f7663df021d64  $verification_root/signed-candidate-bytes.tar.gz" \
            | sha256sum --check --strict
          echo "51fc10894dc9c0ff99c528a9778b01e4f78cf8354a13ca300d449c9b8fca4072  $verification_root/signed-candidate-receipt.json" \
            | sha256sum --check --strict
