name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Repository and localization checks
        run: |
          python3 scripts/check_repository.py
          python3 scripts/check_localizations.py
          python3 scripts/check_store_metadata.py
          python3 scripts/check_store_assets.py
          git diff --check
      - name: Static analysis, tests, migrations, and Android release build
        run: >-
          ./gradlew ktlintCheck
          :shared:allTests
          :shared:testAndroidHostTest
          :shared:verifySqlDelightMigration
          :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build iOS application without signing
        run: >-
          xcodebuild
          -project iosApp/Nimbo.xcodeproj
          -scheme Nimbo
          -configuration Release
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          ARCHS=arm64
          ONLY_ACTIVE_ARCH=YES
          build
