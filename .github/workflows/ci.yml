name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Install Python validation dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==12.2.0
      - name: Ensure media validation tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffprobe -version
          ffmpeg -version
      - name: Compile and test growth tooling
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts/growth/tests -p 'test_*.py'
      - name: Repository and localization checks
        run: |
          python3 scripts/check_repository.py
          python3 scripts/verify_release_artifacts.py
          python3 scripts/check_release_qa_matrix.py
          python3 scripts/check_localizations.py
          python3 scripts/check_store_metadata.py
          python3 scripts/check_store_assets.py
          python3 scripts/check_store_previews.py
          python3 scripts/check_dashboard_report.py
          python3 scripts/build_site.py --output build/pages-ci
          python3 scripts/build_site.py --output build/pages-drafts-ci --include-drafts
          git diff --check
      - name: Static analysis, tests, migrations, and Android release build
        run: >-
          ./gradlew ktlintCheck
          :shared:allTests
          :shared:testAndroidHostTest
          :app:testDebugUnitTest
          :wearApp:testDebugUnitTest
          :shared:verifySqlDelightMigration
          :app:lintRelease
          :wearApp:lintRelease
          :app:bundleRelease
          :wearApp:bundleRelease
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-release-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wear-release-unsigned
          path: wearApp/build/outputs/bundle/release/wearApp-release.aab
          if-no-files-found: error
          retention-days: 7

  android-ui:
    name: Android UI (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone-api24
            api-level: 24
            profile: pixel_2
          - name: phone-api36
            api-level: 36
            profile: pixel_7
          - name: tablet-api36
            api-level: 36
            profile: pixel_tablet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Enable KVM when available
        shell: bash
        run: |
          if [[ -e /dev/kvm ]]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
              | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "KVM is unavailable; emulator runner will select its supported fallback."
          fi
      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio
            -no-boot-anim -camera-back none
          script: ./gradlew :shared:connectedAndroidDeviceTest --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: android-ui-results-${{ matrix.name }}
          path: |
            shared/build/outputs/androidTest-results
            shared/build/reports/androidTests
          if-no-files-found: warn
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - name: Validate release source identity
        id: release-source
        run: |
          revision="$(python3 scripts/verify_release_artifacts.py --print-source-revision)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Run shared iOS Simulator tests
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Run iOS glanceable-surface state tests
        run: bash scripts/test_ios_surfaces.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ios-simulator-test-results
          path: |
            shared/build/test-results/iosSimulatorArm64Test
            shared/build/reports/tests/iosSimulatorArm64Test
          if-no-files-found: warn
          retention-days: 7
      - name: Build iOS application without signing
        run: |
          xcodebuild \
            -project iosApp/Nimbo.xcodeproj \
            -scheme NimboSimulator \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            NIMBO_SOURCE_REVISION='${{ steps.release-source.outputs.revision }}' \
            build
          xcodebuild \
            -project iosApp/Nimbo.xcodeproj \
            -scheme NimboWatch \
            -configuration Release \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            NIMBO_SOURCE_REVISION='${{ steps.release-source.outputs.revision }}' \
            build
