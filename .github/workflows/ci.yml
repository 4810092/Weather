name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-and-shared:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Python validation dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==12.2.0
      - name: Ensure media validation tools
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ffprobe -version
          ffmpeg -version
      - name: Compile and test growth tooling
        run: |
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts/growth/tests -p 'test_*.py'
      - name: Repository and localization checks
        run: |
          python3 scripts/check_repository.py
          python3 scripts/check_release_qa_matrix.py
          python3 scripts/check_localizations.py
          python3 scripts/check_store_metadata.py
          python3 scripts/check_store_assets.py
          python3 scripts/check_store_previews.py
          python3 scripts/check_dashboard_report.py
          python3 scripts/build_site.py --output build/pages-ci
          python3 scripts/build_site.py --output build/pages-drafts-ci --include-drafts
          git diff --check
      - name: Static analysis, tests, migrations, and Android release build
        run: >-
          ./gradlew ktlintCheck
          :shared:allTests
          :shared:testAndroidHostTest
          :app:testDebugUnitTest
          :wearApp:testDebugUnitTest
          :shared:verifySqlDelightMigration
          :app:bundleRelease
          :wearApp:bundleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: android-release-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: wear-release-unsigned
          path: wearApp/build/outputs/bundle/release/wearApp-release.aab
          if-no-files-found: error
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run shared iOS Simulator tests
        run: ./gradlew :shared:iosSimulatorArm64Test
      - name: Run iOS glanceable-surface state tests
        run: bash scripts/test_ios_surfaces.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-simulator-test-results
          path: |
            shared/build/test-results/iosSimulatorArm64Test
            shared/build/reports/tests/iosSimulatorArm64Test
          if-no-files-found: warn
          retention-days: 7
      - name: Build iOS application without signing
        run: |
          xcodebuild \
            -project iosApp/Nimbo.xcodeproj \
            -scheme NimboSimulator \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build
          xcodebuild \
            -project iosApp/Nimbo.xcodeproj \
            -scheme NimboWatch \
            -configuration Release \
            -sdk watchsimulator \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            build
