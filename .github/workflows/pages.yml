name: GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/pages.yml"
      - "branding/store/nimbo-app-icon-1024.png"
      - "growth/baseline/**"
      - "growth/content/**"
      - "growth/dashboard/**"
      - "growth/data/public-rank/**"
      - "growth/kpi-framework.json"
      - "growth/quality/gates.json"
      - "growth/reports/**"
      - "scripts/build_site.py"
      - "scripts/check_dashboard_report.py"
      - "scripts/check_release_qa_matrix.py"
      - "scripts/check_store_assets.py"
      - "scripts/check_store_metadata.py"
      - "scripts/release_artifact_verifier.py"
      - "scripts/verify_release_artifacts.py"
      - "scripts/growth/tests/test_site_articles.py"
      - "site/**"
      - "store/assets/google-play/**"
      - "store/creative-sets/growth-2026-08.json"
      - "store/metadata.json"
      - "store/metadata.schema.json"
      - "store/screenshots/**"
      - "store/upload-manifest-1.1.0.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install site validation dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow==12.2.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Build and validate localized site
        run: |
          python3 -m unittest discover -s scripts/growth/tests -p 'test_site_articles.py'
          python3 scripts/verify_release_artifacts.py
          python3 scripts/check_release_qa_matrix.py
          python3 scripts/check_store_metadata.py
          python3 scripts/check_store_assets.py
          python3 scripts/check_dashboard_report.py
          python3 scripts/build_site.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
